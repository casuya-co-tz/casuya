# Gzip compression — the single biggest 2G/3G win for text assets.
# (Brotli is applied automatically at the Cloudflare edge; do not enable the
#  nginx brotli module here unless the image is built with nginx-brotli.)
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    font/otf;
# Serve pre-compressed .gz/.br files if present (emit them in the build step).
gzip_static on;

server {
    listen 80;
    http2 on;
    client_max_body_size 50M;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded media is content-addressed by filename, so it is safe to cache
    # at the edge for a long time. `expires` sets Cache-Control without breaking
    # inheritance of the security headers declared at server level.
    location /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_set_header Host $host;
        expires 1y;
    }

    # Vendor libs (KaTeX, etc.) rarely change -> cache for a year. Switch to
    # hash-versioned filenames to make this fully safe across updates.
    location /static/lib/ {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri $uri/ =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # Our own HTML/JS bundle is not hash-versioned -> moderate cache.
        expires 1h;
    }
}
