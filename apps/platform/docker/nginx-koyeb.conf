# Koyeb nginx — listens on $PORT (Koyeb injects it), serves the static
# frontend and proxies everything else to uvicorn on :8765. Same origin.
server {
    listen ${PORT} default_server;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/casuya/frontend;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|json|html)$ {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8765/health;
    }
}
