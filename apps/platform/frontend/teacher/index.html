<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal — Casuya</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/casuya-logo.svg">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/main.min.css">
  <link rel="stylesheet" href="/assets/css/teacher.css">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css">
  <style>html:not(.guard-passed) body{visibility:hidden}</style>
  <link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://casuya-platform-production.up.railway.app" crossorigin>
  <link rel="dns-prefetch" href="https://casuya-platform-production.up.railway.app">
  <script>
    (function() {
      var token = localStorage.getItem("casuya_token");
      if (!token) { localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id"); window.location.replace("/login.html"); return; }
      try {
        var payload = JSON.parse(atob(token.split(".")[1]));
        var role = payload.role;
        if (!role || role !== "teacher") {
          localStorage.removeItem("casuya_token"); localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id");
          if (role && {admin:"/admin/",teacher:"/teacher/",student:"/student/"}[role]) { window.location.replace({admin:"/admin/",teacher:"/teacher/",student:"/student/"}[role]); }
          else { window.location.replace("/login.html"); }
          return;
        }
      } catch(e) {
        localStorage.removeItem("casuya_token"); localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id");
        window.location.replace("/login.html"); return;
      }
      document.documentElement.classList.add("guard-passed");
      (function checkMaintenance() {
        try {
          var apiBase = window.CASUYA_API_URL || (function () {
            var port = window.location.port;
            var sameOrigin = port === "8765" || port === "" || port === "443" || port === "80";
            return sameOrigin ? window.location.origin : window.location.protocol + "//" + window.location.hostname + ":8765";
          })();
          fetch(apiBase + "/settings/maintenance", { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.enabled === true) { renderMaintenance(data); }
            })
            .catch(function () {});
        } catch (err) {}
      })();
      function renderMaintenance(data) {
        try {
          if (document.getElementById("casuya-maintenance")) return;
          var fmt = data.until ? new Date(data.until) : null;
          var whenHtml = "";
          if (fmt && !isNaN(fmt.getTime())) {
            var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            var whenText = days[fmt.getDay()] + ", " + months[fmt.getMonth()] + " " + fmt.getDate() + (fmt.getHours()||fmt.getMinutes() ? " at " + (fmt.getHours()%12||12) + ":" + (fmt.getMinutes()<10?"0":"") + fmt.getMinutes() + (fmt.getHours()>=12?" PM":" AM") : "");
            whenHtml = '<p style="margin:1.25rem 0 0;font-size:1rem;color:rgba(255,255,255,0.92);font-weight:600">' + "We should be back by <span style='border-bottom:2px solid rgba(255,255,255,0.55)'>&nbsp;" + whenText + "&nbsp;</span></p>";
          }
          var overlay = document.createElement("div");
          overlay.id = "casuya-maintenance";
          overlay.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(140deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;overflow:auto";
          overlay.innerHTML = '<div style="max-width:560px;width:100%">'
            + '<div style="width:56px;height:56px;margin:0 auto 1.25rem;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.15);border-radius:16px;font-size:1.7rem">🔧</div>'
            + '<h1 style="margin:0 0 0.75rem;font-size:1.85rem;line-height:1.2;font-weight:800">' + (data.title || "We'll Be Back Soon") + '</h1>'
            + '<p style="margin:0 auto;font-size:1.05rem;line-height:1.7;color:rgba(255,255,255,0.92);max-width:460px">' + (data.message || "We're making a few careful improvements to Casuya to serve you even better. Your learning progress is safe with us — hang tight, we're almost ready to welcome you back.") + '</p>'
            + whenHtml
            + '<p style="margin:1.5rem 0 0;font-size:0.85rem;color:rgba(255,255,255,0.7)">Thank you for your patience — see you very soon. 💙</p>'
            + '</div>';
          document.body.appendChild(overlay);
          var app = document.getElementById("app");
          if (app) app.style.visibility = "hidden";
        } catch (err) {}
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/lib/katex/katex.min.css" crossorigin="anonymous">
  <script defer src="/static/lib/katex/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="/static/lib/katex/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <script src="/assets/js/env.js" defer></script>
  <script src="/assets/js/config.js" defer></script>
  <script src="/assets/js/teacher.bundle.js" defer></script>
  <script src="/assets/js/brand.js" defer></script>
<script src="/assets/js/rum.js" defer></script>
</body>
</html>
