<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Casuya</title>
  <link rel="stylesheet" href="/assets/css/main.min.css">
  <link rel="stylesheet" href="/assets/css/student.css">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css">
  <style>html:not(.guard-passed) body{visibility:hidden}</style>
  <link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function() {
      var token = localStorage.getItem("casuya_token");
      if (!token) { localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id"); window.location.replace("/login.html"); return; }
      try {
        var payload = JSON.parse(atob(token.split(".")[1]));
        var role = payload.role;
        var isStudentRole = role === "student" || role === "special_needs";
        if (!role || !isStudentRole) {
          localStorage.removeItem("casuya_token"); localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id");
          if (role && {admin:"/admin/",teacher:"/teacher/",student:"/student/",special_needs:"/student/"}[role]) { window.location.replace({admin:"/admin/",teacher:"/teacher/",student:"/student/",special_needs:"/student/"}[role]); }
          else { window.location.replace("/login.html"); }
          return;
        }
      } catch(e) {
        localStorage.removeItem("casuya_token"); localStorage.removeItem("casuya_role"); localStorage.removeItem("casuya_refresh_token"); localStorage.removeItem("casuya_user_id");
        window.location.replace("/login.html"); return;
      }
      document.documentElement.classList.add("guard-passed");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/assets/js/env.js" defer></script>
  <script src="/assets/js/config.js" defer></script>
  <script src="/assets/js/student.bundle.js" defer></script>
  <script src="/assets/js/brand.js" defer></script>
  <script src="/assets/js/vendor-blackboard.min.js" defer></script>
  <script src="/assets/js/blackboard-embed.js" defer></script>
<script src="/assets/js/rum.js" defer></script>
</body>
</html>
