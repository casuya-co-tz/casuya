name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      JWT_SECRET: ci-test-secret-that-is-at-least-thirty-two-chars
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.11.0"

      - name: Lint (ruff)
        run: ruff check backend/ integrations/

      - name: Format check (ruff)
        run: ruff format --check backend/ integrations/

      - name: Test (pytest)
        run: pytest tests/ -v
        env:
          REDIS_URL: redis://localhost:6379/1
