name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          # --scope removed: infer team from VERCEL_TOKEN; avoids scope-not-accessible when token belongs to different team
          url=$(vercel deploy --prod --yes --project=casuya-platform --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
