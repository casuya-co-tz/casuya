# Casuya Hybrid — production deploy.
# The web service builds from the repo root using the canonical multi-stage
# Dockerfile at infra/Dockerfile.
version: "1"
projects:
  - name: casuya-hybrid
    environments:
      - name: Production
        services:
          - type: web
            name: casuya-backend
            runtime: docker
            repo: https://github.com/casuya-co-tz/casuya
            plan: free
            envVars:
              - key: CORS_ORIGINS
                sync: false
              - key: CASUYA_ADMIN_PASSWORD
                sync: false
              - key: CASUYA_ADMIN_NAME
                sync: false
              - key: CASUYA_ADMIN_EMAIL
                sync: false
              - key: ALLOWED_ORIGINS
                sync: false
              - key: SESSION_SECRET
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: REDIS_URL
                sync: false
              - key: DATABASE_URL
                sync: false
              - key: DEBUG
                sync: false
              - key: APP_ENV
                sync: false
              - key: ENVIRONMENT
                sync: false
              - key: PORT
                sync: false
            region: frankfurt
            dockerContext: .
            dockerfilePath: infra/Dockerfile
            autoDeployTrigger: commit
            rootDir: .
