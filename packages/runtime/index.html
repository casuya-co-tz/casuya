<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casuya Runtime</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8fa;
      color: #111827;
    }
    .card {
      max-width: 560px;
      padding: 2.5rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    code { background: #eef2ff; padding: .15rem .4rem; border-radius: 4px; font-size: .9em; }
    #status { margin-top: 1rem; font-size: .95rem; color: #374151; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Casuya Runtime</h1>
    <p>The Lesson Player — safely executes educational lesson packages on low-end devices.</p>
    <p>Loaded <code>casuya-runtime.min.js</code> (<span id="size"></span> bytes)</p>
    <p id="status">Checking availability…</p>
  </main>
  <script src="./casuya-runtime.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const size = document.getElementById('size');
    const byteLength = fetch('./casuya-runtime.min.js')
      .then((r) => r.arrayBuffer())
      .then((b) => { size.textContent = b.byteLength.toLocaleString(); })
      .catch(() => { size.textContent = 'unknown'; });
    if (typeof CasuyaRuntime !== 'undefined') {
      status.textContent = 'CasuyaRuntime is available (' + Object.keys(CasuyaRuntime).join(', ') + ').';
    } else {
      status.textContent = 'CasuyaRuntime not loaded.';
    }
  </script>
</body>
</html>
