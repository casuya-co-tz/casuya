name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Build all packages (in dependency order)
        run: pnpm build

      - name: Build editor demo
        run: pnpm --filter @casuya/editor run build:demo

      - name: Deploy ds-playground
        run: |
          vercel build --yes --prod --cwd apps/ds-playground --project=ds-playground --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --prod --cwd apps/ds-playground --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy editor
        run: |
          vercel build --yes --prod --cwd packages/editor --project=editor --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --prod --cwd packages/editor --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy runtime
        run: |
          vercel build --yes --prod --cwd packages/runtime --project=runtime --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --prod --cwd packages/runtime --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy platform (static)
        run: |
          vercel build --yes --prod --cwd apps/platform/frontend --project=frontend --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --prod --cwd apps/platform/frontend --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
