name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Build & deploy ds-playground
        run: |
          pnpm --filter @casuya/playground build
          vercel build --yes --cwd apps/ds-playground --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --cwd apps/ds-playground --prod --scope=casuya-codes --project=ds-playground --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build & deploy editor
        run: |
          pnpm --filter @casuya/editor run build:demo
          vercel build --yes --cwd packages/editor --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --cwd packages/editor --prod --scope=casuya-codes --project=editor --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build & deploy runtime
        run: |
          pnpm --filter casuya-runtime run build
          vercel build --yes --cwd packages/runtime --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --cwd packages/runtime --prod --scope=casuya-codes --project=runtime --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy platform (static)
        run: |
          vercel build --yes --cwd apps/platform/frontend --scope=casuya-codes --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --yes --cwd apps/platform/frontend --prod --scope=casuya-codes --project=platform --token=${{ secrets.VERCEL_TOKEN }}
